{% extends "squiggle_automation/internal.html" %}
{% load i18n crispy_forms_tags %}

{% block content %}
<h1>{% blocktrans trimmed with name=object.username %}Reset password for "{{ name }}"{% endblocktrans %}</h1>

<div class="row">
    <div class="col-12">
        <form method="post">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-check-lg"></i> {% trans "Save" %}</button>
        </form>
    </div>
</div>
{% endblock %}
