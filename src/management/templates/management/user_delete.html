{% extends "squiggle_automation/internal.html" %}
{% load i18n %}

{% block content %}
<h1 class="text-danger">{% trans "Delete user" %}</h1>

<div class="row">
    <div class="col-12">
        <p class="text-danger">{% blocktrans trimmed with name=object.username %}Do you want to delete the user "{{ name }}"?{% endblocktrans %}</p>

        <p class="text-danger">{% trans "This cannot be undone." %}</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger"><i class="bi bi-trash3"></i> {% trans "Delete" %}</button>
        </form>
    </div>
</div>
{% endblock %}
