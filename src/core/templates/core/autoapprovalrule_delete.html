{% extends "squiggle_automation/internal.html" %}
{% load i18n crispy_forms_tags %}

{% block content %}
<h1 class="text-danger">{% trans "Delete auto approval rule" %}</h1>

<div class="row">
    <div class="col-12">
        <p class="text-danger">{% blocktrans trimmed %}Do you want to delete the auto approval rule "{{ object }}"?{% endblocktrans %}</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger"><i class="bi bi-trash3"></i> {% trans "Delete" %}</button>
        </form>
    </div>
</div>
{% endblock %}
