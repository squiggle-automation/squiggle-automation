{% extends "squiggle_automation/internal.html" %}
{% load i18n crispy_forms_tags %}

{% block content %}
{% if object %}
    <h1>{% trans "Edit auto approval rule" %}</h1>
{% else %}
    <h1>{% trans "Create auto approval rule" %}</h1>
{% endif %}

<div class="row">
    <div class="col-12">
        <form method="post">
            {% csrf_token %}
            {{ form | crispy }}

            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-check-lg"></i> {% trans "Save" %}</button>
        </form>
    </div>
</div>
{% endblock %}
