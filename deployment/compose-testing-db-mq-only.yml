# Just runs PostgreSQL and RabbitMQ (for testing of the app during devlopment)

name: squiggle-automation-testing

services:
  db:
    image: postgres

    shm_size: 128mb

    volumes:
      - db-data:/var/lib/postgresql

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - 5432:5432

  mq:
    image: rabbitmq:4.2

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

    volumes:
      - mq-data:/var/lib/rabbitmq

    configs:
      - source: rabbitmq-advanced-config
        target: /etc/rabbitmq/advanced.config

    ports:
      - 5672:5672

volumes:
  db-data:
  mq-data:

configs:
  rabbitmq-advanced-config:
    content: |
      % Celery tasks can run far longer than RabbitMQ's default timeout
      [
        {rabbit, [
          {consumer_timeout, false}
        ]}
      ].
