// Minimal, self-contained named.conf for the executor test environment.
// Authoritative-only for test.local - no recursion, no forwarders, no internet access needed.
// Overrides the package default entirely (not included from it).

options {
    directory "/var/cache/bind";
    recursion no;
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    allow-transfer { any; };  // needed for the dnsx "-axfr" test case
};

zone "test.local" {
    type master;
    file "/etc/bind/zones/test.local.zone";
};

// used by the ad-enum-dcs tests - a separate zone so its SRV/A records don't show up in
// the dnsx "forward-axfr" test case's full transfer of test.local
zone "ad.test.local" {
    type master;
    file "/etc/bind/zones/ad.test.local.zone";
};

zone "100.100.100.in-addr.arpa" {
    type master;
    file "/etc/bind/zones/100.100.100.in-addr.arpa.zone";
};

// reverse zone for the 2001:db8::/64 documentation prefix (RFC 3849)
zone "0.0.0.0.0.0.0.0.8.b.d.0.1.0.0.2.ip6.arpa" {
    type master;
    file "/etc/bind/zones/2001-db8.ip6.arpa.zone";
};
